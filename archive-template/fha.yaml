# fha.yaml - archive configuration (plain, hand-editable). See SPEC.md §12.4.
#
# This one file tells the tools where your photos and documents live. Edit it with
# any plain text editor (Notepad, TextEdit - not Word). Copy-paste examples for the
# common setups are right below, under "Examples" - uncomment the one that matches
# your setup and edit the path.
#
# root_person: P-xxxxxxxxxx
#   Set to the P-id of your direct-line descendant at Ahnentafel position #1
#   (typically the researcher or the focal youngest generation).
#   Any full sibling works - siblings share one ancestor tree.
#   Enables Ahnentafel folder-number verification and person placement via
#   `fha views brackets`. Omit to disable those checks.
#
# Root aliases: record paths like "photos/1880/…" resolve their first segment here.
# Use an absolute path to keep a library outside the archive.
#
# ── Examples (uncomment and edit ONE photos: line; defaults below work as-is) ──
#
#   Plain folders inside this archive (the default - keep everything together):
# roots:
#   photos: photos
#   documents: documents
#
#   An external drive (Windows uses a drive letter; Mac uses /Volumes):
# roots:
#   photos: D:/FamilyPhotos              # Windows
#   photos: /Volumes/Archive/Photos      # Mac
#   documents: documents
#
#   An existing photo library (e.g. a Lightroom folder) left where it is:
# roots:
#   photos: C:/Users/you/Pictures/Lightroom   # Windows
#   photos: /Users/you/Pictures/Lightroom     # Mac
#   documents: documents
#
# ── Keeping part of the photo library out of the catalog (optional) ──
#   If the photos folder also holds material that is not part of the family
#   history (a bulk export from a photo-sharing account, phone camera rolls),
#   list it here and `fha photoindex` will skip it - so photo search and the
#   "what should I process next?" ranking see only the real subject. Patterns
#   are folder or file names relative to the photos root; `*` is a wildcard.
#   Do NOT narrow `photos:` above to a subfolder instead: any photo already
#   attached to a source record from a sibling folder would stop resolving.
#
# photos_ignore:
#   - Flickr Export
#   - Phone Backups/*
#   - '*.tif'
#
# ── A safety copy of every photo fha writes into (optional, recommended) ──
#   To keep your photo tool (Lightroom and the like) from losing track of a
#   photo, fha writes its keywords and captions INTO the original file rather
#   than making a new one. That is the right trade, but it means the only copy
#   of an irreplaceable family photograph is the one being written to.
#
#   Name a folder here and fha will tuck away one untouched copy of each photo
#   BEFORE it writes to it for the first time - the photo exactly as your camera
#   or scanner left it. A photo that already has a copy there is left alone, so
#   the space this needs is one copy of the photos you actually work on, not a
#   second copy of your whole library.
#
#   The folder must be OUTSIDE this archive and outside your photos and
#   documents folders - ideally on a different disk. A copy kept inside the
#   photo library would be catalogued as another photo; a copy kept inside the
#   archive shares its fate. If the copy cannot be made, fha refuses to write to
#   the photo and says why: a safety copy you are relying on must never quietly
#   not happen. Leave the line out and nothing changes, except that fha says
#   once per run that no copies are being kept.
#
# originals_backup: D:/PhotoOriginals        # Windows
# originals_backup: /Volumes/Archive/PhotoOriginals   # Mac

# ── Biography voice (optional) ──
#   How the assistant's drafted biographies read. The facts and citations are
#   identical either way - this only sets the voice. You can always override
#   in the moment by asking ("tell it like a story" / "just the facts").
#
# biography:
#   style: chronicle    # chronicle (era-by-era, fact-forward - the default) | narrative (story-driven)

# ── Promotion nudges (optional) ──
#   When a not-yet-curated person accumulates this many accepted facts, the
#   report and review sessions start suggesting a real profile for them.
#   Suggestions only - nothing is ever promoted without your say-so.
#
# promotion:
#   claims_threshold: 5    # default 5 when the key is absent

# ── Active configuration (the defaults; edit these to match your setup) ──
roots:
  photos: photos
  documents: documents
