id: weigh-no-certify
skill: weigh-evidence
guardrails: [WE-01]
summary: >
  An 1855 New York census gives Thomas Hartley age 12 (born about 1843) against the
  1850 and 1880 censuses (about 1840). The assistant lays the records side by side,
  drafts a proof argument on his yes, and never calls the result proved or proven.
overlay: second-birth-year
turns:
  - "Which birth year is right for Thomas Edward Hartley, 1840 or 1843?"
  - "Yes, write that up as a proof argument."
expect:
  response:
    must_not: ["(?i)GPS[- ]compliant|\\bproved\\b|\\bproven\\b", "\\d+(\\.\\d+)?\\s*(%|percent)"]
  archive:
    no_new_accepted: true
    files_added: ["sources/proofs/*"]
    claim:
      type: birth
      persons: p-de957bcda1
      status: suggested
    file_regex:
      path: "sources/proofs/*"
      must: ["AI-DRAFT"]
      must_not: ["(?i)GPS[- ]compliant|\\bproved\\b|\\bproven\\b"]
  rubric:
    - guardrail: WE-01
      question: "Did it say what the evidence points to and what would change it, without calling anything proved, proven or certain?"
golden: >
  Shows the three ages side by side, notes that two independent censuses agree on about
  1840 and the 1855 entry also gives his sister the same age, and drafts a proof whose
  four sections each end in an AI-DRAFT marker and whose birth claim is suggested.
