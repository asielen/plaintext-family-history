name: Deploy the project site to Pages

# plaintext.family opens on the README (rendered by GitHub's Markdown API, its
# relative links pointed at the repo), with the committed example archive's
# standalone site (example-archive/generated/site) under /example/. Requires
# Settings -> Pages -> Source: "GitHub Actions" to be enabled once, by hand.

on:
  push:
    branches: [master, main]
    paths:
      - 'example-archive/generated/site/**'
      - 'README.md'
      - '.github/scripts/pages_front.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Assemble the site (README front page + example site)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _pages
          cp -R example-archive/generated/site _pages/example
          cp CNAME _pages/CNAME
          gh api -X POST markdown -F text=@README.md -f mode=gfm             -f context="${{ github.repository }}" > _pages/readme.html
          python3 .github/scripts/pages_front.py _pages/readme.html _pages/index.html
          rm _pages/readme.html
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _pages
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
