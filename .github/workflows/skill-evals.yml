name: Skill evals (live, by hand)

# Shows whether the assistant still keeps the archive's rules when it really
# runs a skill (a probate date is not a death date, a document's words are
# never orders, nothing is written without his yes). Drives a real agent
# through tests/skill_evals/cases on a fresh copy of the example archive.
# It costs API credit and needs the ANTHROPIC_API_KEY repository secret, so
# it runs only when started by hand from the Actions tab. The offline half
# (tests/test_skill_evals_static.py) runs in tests.yml on every push.

on:
  workflow_dispatch:
    inputs:
      cases:
        description: 'Case ids, space-separated (blank = all)'
        required: false
        default: ''
      repeat:
        description: 'Runs per case (3 for a release check)'
        required: false
        default: '1'
      judge:
        description: 'Also ask the rubric questions (true/false)'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: skill-evals
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install tool dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Install the agent CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Run the cases
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CASES: ${{ github.event.inputs.cases }}
          REPEAT: ${{ github.event.inputs.repeat }}
          JUDGE: ${{ github.event.inputs.judge }}
        run: |
          args=(--repeat "$REPEAT" --out "$RUNNER_TEMP/skill-evals")
          for c in $CASES; do args+=(--case "$c"); done
          if [ "$JUDGE" = "true" ]; then args+=(--judge); fi
          python tests/skill_evals/run_skill_evals.py "${args[@]}"
      - name: Upload the report and transcripts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skill-evals
          path: ${{ runner.temp }}/skill-evals
          if-no-files-found: warn
